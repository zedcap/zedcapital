<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ZΞD|CAPITAL</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="gate-page">
<main>
<section class="modal" aria-label="Private access">
  <a class="close" href="index.html" aria-label="Close"></a>
  <a class="mlogo-link" href="index.html" aria-label="ZΞD|CAPITAL home"><img class="mlogo" src="img/logo.png" alt="ZΞD|CAPITAL" width="931" height="161"></a>
  <div id="gate-body">
    <form class="gate" id="gate" autocomplete="off">
      <label class="mlabel" for="pw">Private access</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <button class="enter" type="submit">Enter</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </div>
</section>
</main>
<script>
const BLOB = "Afn4OCnBwF7w0EZ3dSLUf+33RA9ykRTjSQ9j+iuN1H/1GhVGYwr7+03g+f2zYiBxF6bqmmh5JLjv8MtzWRL/F+w=";
const ITER = 600000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw) {
  const raw = b64(BLOB), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct));
}
document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const html = await open(document.getElementById("pw").value);
    document.getElementById("gate-body").innerHTML = '<div class="private">' + html + '</div>';
  } catch (_) {
    err.textContent = "Incorrect password.";
    document.getElementById("pw").select();
  }
});
</script>
</body>
</html>
